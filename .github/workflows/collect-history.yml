name: V3 Historical Data Collection

on:
  workflow_dispatch:
  schedule:
    - cron: '30 8 * * 1-5'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Check stock pool and collect
        run: |
          python - <<'PY'
          from pathlib import Path
          codes = [x.strip() for x in Path('stocks.txt').read_text().splitlines() if x.strip() and not x.lstrip().startswith('#')]
          assert len(codes) == 28 and len(set(codes)) == 28, f'Stock pool incomplete: {len(codes)}/28'
          PY
          python collect_data.py --codes-file stocks.txt --start 20160101 --end 20261117 --root .
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-data-and-reports
          path: |
            data/
            data_adjusted/
            data_factors/
            reports/
          if-no-files-found: warn